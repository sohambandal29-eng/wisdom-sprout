<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Instagram</title>
    
    <link rel="stylesheet" href="./instafrom.css" />
  </head>
  <body>
    <div class="bg-container">
      <div class="left-section">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTJSN56hdPbvHRG1HfK3w_Ke-0ml1rlfQOXAJmmQsMj_A&s=10" class="instagramLogo" />
        <div class="heading-wrap">
          <h1 class="left-section-heading">See everyday moments from your <span class="special-word">close friends</span>.</h1>
        </div>
        <div class="reel-image-section">
            <img src="https://lookaside.fbsbx.com/elementpath/media/?media_id=2563038064161855&version=1785424047&transcode_extension=webp" class="instagramFeedImage" />
        </div>
      </div>
      <div class="right-section">
       <div class="right-container">
         <h1 class="formHeading">Log into Instagram</h1>
        <form>
          <input
            type="text"
            placeholder="Mobile number, username or email"
            class="userName"
          />
          <input type="password" placeholder="Password" class="password" />
          <button class="loginBtn">Log in</button>
          <p class="forgotPassword">Forgot password?</p>
          <div>
            <button class="loginfacebookBtn">Login with Facebook</button>
            <button class="createAc">Create new account</button>
          </div>
        </form>
       </div>
      </div>
    </div>
  </body>
</html>
