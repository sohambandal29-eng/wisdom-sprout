<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./registrationfrom.css"/>
</head>
<body>
    <div class="container">
        <h2>Registration</h2>
        <form>
            <h3>Personal Details</h3>
            <div class="form-row">
                <div class="input-box">
                    <label>Full Name</label>
                    <input type="text" placeholder="Enter your name">
                </div>
                <div class="input-box">
                    <label>Date of Birth</label>
                    <input type="date" placeholder="Enter birth date">
                </div>
                <div class="input-box">
                    <label>Email</label>
                    <input type="email" placeholder="Enter your email">
                </div>
            </div>
            <div class="form-row">
                <div class="input-box">
                    <label>Mobile Number</label>
                    <input type="tel" placeholder="Enter mobile number">
                </div>
                <div class="input-box">
                    <label>Gender</label>
                    <input type="text" placeholder="Enter your gender">
                </div>
                <div class="input-box">
                    <label>Occupation</label>
                    <input type="text" placeholder="Enter occupation">
                </div>
            </div>
            <h3>Identity Details</h3>
            <div class="form-row">
                <div class="input-box">
                    <label>ID Type</label>
                    <input type="text" placeholder="Enter ID type">
                </div>
                <div class="input-box">
                    <label>ID Number</label>
                    <input type="text" placeholder="Enter ID number">
                </div>
                <div class="input-box">
                    <label>Issue Authority</label>
                    <input type="text" placeholder="Enter issue department">
                </div>
            </div>
            <div class="form-row">
                <div class="input-box">
                    <label>Issue Date</label>
                    <input type="text" placeholder="Enter ID issue date">
                </div>
                <div class="input-box">
                    <label>Issue State</label>
                    <input type="text" placeholder="Enter ID issue state">
                </div>
                <div class="input-box">
                    <label>Expiry Date</label>
                    <input type="text" placeholder="Enter ID expiry date">
                </div>
            </div>
            <button type="button">Next →</button>
        </form>
    </div>
</body>
</html>
