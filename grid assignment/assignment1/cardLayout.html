
<!DOCTYPE html>
<html>
<head>
    <title>Card Layout</title>
    <link rel="stylesheet" href="cardLayout.css">
</head>
<body>
    <h2>Our Cards</h2>
    <div class="container">
        <div class="card">
            <img src="https://picsum.photos/id/10/400/250" alt="Nature">
            <h3>Nature</h3>
            <p>Nature is beautiful and full of life.</p>
        </div>
        <div class="card">
            <img src="https://picsum.photos/id/11/400/250" alt="Mountain">
            <h3>Mountain</h3>
            <p>Mountains provide beautiful views.</p>
        </div>
        <div class="card">
            <img src="https://picsum.photos/id/12/400/250" alt="Forest">
            <h3>Forest</h3>
            <p>Forests are home to many animals.</p>
        </div>
        <div class="card">
            <img src="https://picsum.photos/id/13/400/250" alt="Lake">
            <h3>Lake</h3>
            <p>Lakes are peaceful and beautiful.</p>
        </div>
    </div>
</body>
</html>
