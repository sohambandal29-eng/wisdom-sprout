<!DOCTYPE html>
<html>
<head>
    <title>Dashboard Layout</title>
    <link rel="stylesheet" href="dashboardLayout.css">
</head>
<body>
    <div class="dashboard">
        <header>
            <h2>My Dashboard</h2>
        </header>
        <nav>
            <h3>Navigation</h3>
            <p>Home</p>
            <p>Profile</p>
            <p>Settings</p>
        </nav>
        <main>
            <h2>Main Content</h2>
            <p>Welcome to your dashboard!</p>
            <div class="cards">
                <div class="card">Total Users: 100</div>
                <div class="card">Orders: 50</div>
                <div class="card">Revenue: ₹5000</div>
            </div>
        </main>
        <aside>
            <h3>Notifications</h3>
            <p>No new notifications.</p>
        </aside>
        <footer>
            Dashboard Footer
        </footer>
    </div>
</body>
</html>
