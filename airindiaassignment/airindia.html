    </header>
    <section class="hero">
        <div class="hero-content">
            <h1>
                Fly the new Air India
                <span>Your next journey awaits</span>
            </h1>
            <p>More destinations. More comfort. A better tomorrow.</p>
        </div>
        <div class="booking-container" id="booking">
            <div class="trip-tabs">
                <label class="trip-tab active">
                    <input type="radio" name="trip" checked>
                    <i class="fa-solid fa-plane"></i>
                    One Way
                </label>
                <label class="trip-tab">
                    <input type="radio" name="trip">
                    <i class="fa-solid fa-arrow-right-arrow-left"></i>
                    Round Trip
                </label>
                <label class="trip-tab">
                    <input type="radio" name="trip">
                    <i class="fa-solid fa-location-dot"></i>
                    Multi-City
                </label>
            </div>
            <form class="flight-form">
                <div class="flight-field">
                    <i class="fa-solid fa-location-dot"></i>
                    <div class="field-content">
                        <label for="from">From</label>
                        <input type="text" id="from"
                        placeholder="Enter departure city" required>
                    </div>
                </div>
                <button type="button" class="swap-btn"
                aria-label="Swap departure and arrival">
                    <i class="fa-solid fa-arrow-right-arrow-left"></i>
            </button>
                <div class="flight-field">
                    <i class="fa-solid fa-location-dot"></i>
                    <div class="field-content">
                        <label for="to">To</label>
                        <input type="text" id="to"
                        placeholder="Enter arrival city" required>
                    </div>
                </div>
                <div class="flight-field date-field">
                    <i class="fa-regular fa-calendar-days"></i>
                    <div class="field-content">
                        <label for="departure">Departure Date</label>
                        <input type="date" id="departure" required>
                    </div>
                </div>

                <div class="flight-field passenger-field">
                    <i class="fa-regular fa-user"></i>
                    <div class="field-content">
                        <label for="passengers">Passengers</label>
                        <select id="passengers">
                            <option>1 Passenger</option>
                            <option>2 Passengers</option>
                            <option>3 Passengers</option>
                            <option>4 Passengers</option>
                            <option>5 Passengers</option>
                        </select>
                        <small>Economy</small>
                    </div>
                </div>
                <button type="submit" class="search-btn">
                    Search Flights
                </button>
            </form>
        </div>
    </section>
